{% extends 'base.html' %}

{% block title %}{{ page_title }} - Электронный журнал{% endblock %}

{% block content %}
    <h2>{{ page_title }}</h2>

    <p><a href="{% url 'student_add' %}">Добавить нового студента</a></p>

    <ul>
        {% for student in students_list %}
            <li>
                <a href="{% url 'student_detail' student_id=student.id %}">{{ student }}</a>
            </li>
        {% empty %}
            <li>Список студентов пуст.</li>
        {% endfor %}
    </ul>
{% endblock %}
